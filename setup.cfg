; Configuration File
; This file maintains backward compatibility with older tools.
; Primary configuration is now in pyproject.toml.
;
; To migrate: Modern tools (black, isort, mypy, pytest, coverage) read pyproject.toml first.
; Legacy tools (flake8, pycodestyle) still use this file.

[flake8]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv,.eggs,build,dist
max-complexity = 10
ignore = E203, W503  # Conflicts with black

[pycodestyle]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,venv,.eggs,build,dist

[bdist_wheel]
universal = 0

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py *_test.py testing/python/*.py
addopts = --strict-markers --no-migrations --reuse-db

[coverage:run]
include = apps/* utils/*
omit = */migrations/*,*/tests/*
plugins = django_coverage_plugin
branch = true

[coverage:report]
precision = 2
show_missing = true
skip_covered = False
fail_under = 80
