[pytest]
# Pytest Configuration / Pytest配置

# Django settings module / Django设置模块
DJANGO_SETTINGS_MODULE = config.settings.test

# Python files / Python文件
python_files = test_*.py *_test.py

# Python classes / Python类
python_classes = Test* *Tests

# Python functions / Python函数
python_functions = test_*

# Test paths / 测试路径
testpaths = apps utils

# Add options / 添加选项
addopts =
    --strict-markers
    --no-migrations
    --reuse-db
    -v
    --showlocals
    --cov=apps
    --cov=utils
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Markers / 标记
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Ignore paths / 忽略路径
norecursedirs = .git .tox dist build *.egg venv migrations static media

# Logging / 日志
log_cli = true
log_cli_level = INFO
